name: Сборка Android APK

on:
  push:
    branches: [main, 'claude/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Установка зависимостей
        run: npm ci

      - name: Подготовка веб-части и синхронизация с Android
        run: npm run sync

      - name: Ключ подписи из секретов (если задан)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          else
            echo "Секрет ANDROID_KEYSTORE_BASE64 не задан — APK будет подписан временным ключом"
          fi

      - name: Сборка APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Переименование APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk "dist/Notnyi-bloknot-1.0.${{ github.run_number }}.apk"
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: Notnyi-bloknot-apk
          path: dist/*.apk

      - name: Публикация релиза
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-1.0.${{ github.run_number }}
          name: Нотный блокнот 1.0.${{ github.run_number }} (Android)
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: dist/*.apk
          body: |
            Android-приложение «Нотный блокнот».

            **Установка:** скачайте файл `.apk` ниже на планшет и откройте его.
            Android попросит разрешить установку из этого источника (браузера / «Файлов») — разрешите.
            Перед установкой новой версии на всякий случай сделайте «Резервную копию» в приложении.

            Собрано из коммита ${{ github.sha }}.
